<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d">
  <title id="t">From camera to dashboard</title>
  <desc id="d">A generic pipeline: sense (cameras, MJPEG, PLC over Modbus TCP and Profinet), think (YOLO, anomaly detection, PaddleOCR, vision-language models, agents), serve (FastAPI, Uvicorn, WebSocket, Pydantic), store (SQLite, MySQL, MS SQL Server) and show (React and Vite, Flutter, React Native and Expo).</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <radialGradient id="think-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bc8cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .card { fill: #161b22; stroke: #30363d; }
    .head { font-size: 13px; font-weight: 700; letter-spacing: 3px; }
    .item { font-size: 13px; fill: #c9d1d9; }
    .emit { font-size: 12px; fill: #7d8590; }
    .link { fill: none; stroke: #8b949e; stroke-width: 1.6; }
    .flow { fill: none; stroke: url(#accent); stroke-width: 2; stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
    .glow { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out infinite; }
    @keyframes flow  { to { stroke-dashoffset: -20; } }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
  </style>

  <rect x="1" y="1" width="998" height="398" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text class="mono" x="24" y="44" font-size="14" fill="#7d8590" letter-spacing="3">FROM CAMERA TO DASHBOARD</text>

  <!-- soft glow behind THINK -->
  <ellipse class="glow" cx="324" cy="175" rx="150" ry="150" fill="url(#think-glow)"/>

  <!-- connectors (gap between cards = 38px) -->
  <g>
    <path class="link" d="M198 175 H230" marker-end="url(#arrow)"/>
    <path class="link" d="M418 175 H450" marker-end="url(#arrow)"/>
    <path class="link" d="M588 175 H620" marker-end="url(#arrow)"/>
    <path class="link" d="M770 175 H802" marker-end="url(#arrow)"/>
    <path class="flow" d="M198 175 H230"/>
    <path class="flow" d="M418 175 H450"/>
    <path class="flow" d="M588 175 H620"/>
    <path class="flow" d="M770 175 H802"/>
  </g>

  <!-- SENSE -->
  <g>
    <rect class="card" x="24" y="70" width="172" height="210" rx="12"/>
    <rect x="24" y="70" width="172" height="4" rx="2" fill="#d29922"/>
    <text class="mono head" x="40" y="104" fill="#d29922">SENSE</text>
    <g class="sans item">
      <circle cx="44" cy="133" r="2.5" fill="#d29922"/><text x="54" y="137">Cameras</text>
      <circle cx="44" cy="163" r="2.5" fill="#d29922"/><text x="54" y="167">MJPEG streams</text>
      <circle cx="44" cy="193" r="2.5" fill="#d29922"/><text x="54" y="197">PLC: Modbus TCP</text>
      <circle cx="44" cy="223" r="2.5" fill="#d29922"/><text x="54" y="227">Profinet / Siemens S7</text>
    </g>
    <text class="mono emit" x="40" y="262">frames · registers</text>
  </g>

  <!-- THINK -->
  <g transform="translate(20 0)">
    <rect class="card" x="212" y="70" width="184" height="210" rx="12" style="stroke:#bc8cff;stroke-opacity:.55"/>
    <rect x="212" y="70" width="184" height="4" rx="2" fill="#bc8cff"/>
    <text class="mono head" x="228" y="104" fill="#bc8cff">THINK</text>
    <g class="sans item">
      <circle cx="232" cy="133" r="2.5" fill="#bc8cff"/><text x="242" y="137">YOLO detection</text>
      <circle cx="232" cy="231" r="2.5" fill="#bc8cff"/><text x="242" y="235">Agents with tools</text>
      <circle cx="232" cy="157" r="2.5" fill="#bc8cff"/><text x="242" y="161">Anomaly detection</text>
      <circle cx="232" cy="181" r="2.5" fill="#bc8cff"/><text x="242" y="185">PaddleOCR</text>
      <circle cx="232" cy="206" r="2.5" fill="#bc8cff"/><text x="242" y="210">Vision-language models</text>
    </g>
    <text class="mono emit" x="228" y="262">boxes · text · actions</text>
  </g>

  <!-- SERVE -->
  <g transform="translate(12 0)">
    <rect class="card" x="440" y="70" width="134" height="210" rx="12"/>
    <rect x="440" y="70" width="134" height="4" rx="2" fill="#58a6ff"/>
    <text class="mono head" x="456" y="104" fill="#58a6ff">SERVE</text>
    <g class="sans item">
      <circle cx="460" cy="133" r="2.5" fill="#58a6ff"/><text x="470" y="137">FastAPI</text>
      <circle cx="460" cy="163" r="2.5" fill="#58a6ff"/><text x="470" y="167">Uvicorn</text>
      <circle cx="460" cy="193" r="2.5" fill="#58a6ff"/><text x="470" y="197">WebSocket</text>
      <circle cx="460" cy="223" r="2.5" fill="#58a6ff"/><text x="470" y="227">Pydantic</text>
    </g>
    <text class="mono emit" x="456" y="262">JSON · events</text>
  </g>

  <!-- STORE -->
  <g transform="translate(4 0)">
    <rect class="card" x="618" y="70" width="146" height="210" rx="12"/>
    <rect x="618" y="70" width="146" height="4" rx="2" fill="#79c0ff"/>
    <text class="mono head" x="634" y="104" fill="#79c0ff">STORE</text>
    <g class="sans item">
      <circle cx="638" cy="133" r="2.5" fill="#79c0ff"/><text x="648" y="137">SQLite</text>
      <circle cx="638" cy="163" r="2.5" fill="#79c0ff"/><text x="648" y="167">MySQL</text>
      <circle cx="638" cy="193" r="2.5" fill="#79c0ff"/><text x="648" y="197">MS SQL Server</text>
    </g>
    <text class="mono emit" x="634" y="262">rows</text>
  </g>

  <!-- SHOW -->
  <g transform="translate(-2 0)">
    <rect class="card" x="806" y="70" width="168" height="210" rx="12"/>
    <rect x="806" y="70" width="168" height="4" rx="2" fill="#3fb950"/>
    <text class="mono head" x="822" y="104" fill="#3fb950">SHOW</text>
    <g class="sans item">
      <circle cx="826" cy="133" r="2.5" fill="#3fb950"/><text x="836" y="137">React + Vite</text>
      <circle cx="826" cy="163" r="2.5" fill="#3fb950"/><text x="836" y="167">Flutter</text>
      <circle cx="826" cy="193" r="2.5" fill="#3fb950"/><text x="836" y="197">React Native + Expo</text>
    </g>
    <text class="mono emit" x="822" y="262">views</text>
  </g>

  <!-- data packets hopping from stage to stage (drawn on top of the cards' gaps only) -->
  <circle r="3.5" fill="#d29922"><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" path="M198 175 H230"/></circle>
  <circle r="3.5" fill="#bc8cff"><animateMotion dur="1.6s" begin="0.4s" repeatCount="indefinite" path="M418 175 H450"/></circle>
  <circle r="3.5" fill="#58a6ff"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" path="M588 175 H620"/></circle>
  <circle r="3.5" fill="#3fb950"><animateMotion dur="1.6s" begin="1.2s" repeatCount="indefinite" path="M770 175 H802"/></circle>

  <!-- a second lane under the cards: one packet crosses the whole pipeline -->
  <path d="M24 312 H976" stroke="#21262d" stroke-width="2" fill="none"/>
  <path d="M24 312 H976" stroke="url(#accent)" stroke-width="2" fill="none" stroke-dasharray="2 10" opacity=".7">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2s" repeatCount="indefinite"/>
  </path>
  <circle r="5" fill="#fff" opacity=".9"><animateMotion dur="6s" repeatCount="indefinite" path="M24 312 H976"/></circle>

  <text class="sans" x="500" y="358" font-size="16" fill="#9da7b3" text-anchor="middle">Same shape whether the input is a camera, a PLC register or a prompt.</text>
</svg>
