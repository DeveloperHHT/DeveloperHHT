<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 170" width="420" height="170" role="img" aria-label="Denpointment">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .shine { animation: shine 4s ease-in-out infinite; }
    @keyframes shine { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  </style>
  <rect x="1" y="1" width="418" height="168" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect class="shine" x="1" y="1" width="418" height="4" rx="2" fill="url(#accent)"/>

  <text class="sans" x="24" y="42" font-size="17" font-weight="700" fill="#58a6ff">Denpointment</text>

  <text class="sans" x="24" y="72"  font-size="14" fill="#c9d1d9">A dentist appointment system with Flask:</text>
  <text class="sans" x="24" y="94"  font-size="14" fill="#c9d1d9">booking, treatments and statistics. Layered</text>
  <text class="sans" x="24" y="116" font-size="14" fill="#c9d1d9">backend, light/dark interface, tests, guide.</text>

  <line x1="24" y1="130" x2="396" y2="130" stroke="#21262d"/>
  <circle cx="30" cy="150" r="6" fill="#3572A5"/>
  <text class="sans" x="44" y="155" font-size="13" fill="#8b949e">Python</text>
  <text class="mono" x="396" y="155" font-size="12" fill="#7d8590" text-anchor="end">flask · refactor</text>
</svg>
