<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 10" width="1200" height="10" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset=".25" stop-color="#58a6ff"/>
      <stop offset=".75" stop-color="#bc8cff"/>
      <stop offset="1" stop-color="#bc8cff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spark">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="4" width="1200" height="2" rx="1" fill="url(#fade)" opacity=".7"/>
  <circle cy="5" r="5" fill="url(#spark)">
    <animate attributeName="cx" from="150" to="1050" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
