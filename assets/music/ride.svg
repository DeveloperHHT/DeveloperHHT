<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-labelledby="t d">
  <title id="t">Ride along: @bikerandvibes</title>
  <desc id="d">Animated road with dashed centre line, a low sun and hills, next to the Instagram handle bikerandvibes.</desc>
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb454"/><stop offset=".55" stop-color="#f0603a"/><stop offset="1" stop-color="#e4405f"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1020"/><stop offset=".6" stop-color="#3a1a2a"/><stop offset="1" stop-color="#6b2a2a"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2230"/><stop offset="1" stop-color="#14111a"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd27a"/><stop offset=".45" stop-color="#ff9a4a"/><stop offset="1" stop-color="#ff9a4a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="scene"><rect x="560" y="1" width="439" height="198" rx="0"/></clipPath>
    <clipPath id="card"><rect x="1" y="1" width="998" height="198" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .dash { transform-box: fill-box; transform-origin: center; opacity: 0; animation: drive 1.6s linear infinite; }
    @keyframes drive {
      0%   { transform: translateY(0) scale(1);    opacity: 0 }
      12%  { opacity: 1 }
      100% { transform: translateY(104px) scale(8, 15); opacity: 1 }
    }
    .sun { transform-box: fill-box; transform-origin: center; animation: sun 6s ease-in-out infinite; }
    @keyframes sun { 0%,100% { transform: scale(1); opacity: .9 } 50% { transform: scale(1.08); opacity: 1 } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="200" fill="#0d1117"/>
    <!-- scene -->
    <g clip-path="url(#scene)">
      <rect x="560" y="0" width="440" height="200" fill="url(#sky)"/>
      <circle class="sun" cx="780" cy="84" r="62" fill="url(#sun)"/>
      <polygon points="560,92 610,70 650,86 700,62 745,90 800,74 850,92 900,66 950,88 1000,72 1000,96 560,96" fill="#1a1220"/>
      <rect x="560" y="96" width="440" height="104" fill="#1a1220"/>
      <!-- road -->
      <polygon points="768,96 792,96 1010,200 550,200" fill="url(#road)"/>
      <polyline points="768,96 550,200" fill="none" stroke="#ffb454" stroke-opacity=".55" stroke-width="2"/>
      <polyline points="792,96 1010,200" fill="none" stroke="#ffb454" stroke-opacity=".55" stroke-width="2"/>
      <rect class="dash" x="778.5" y="98" width="3" height="3" fill="#ffd27a"/>
      <rect class="dash" x="778.5" y="98" width="3" height="3" fill="#ffd27a" style="animation-delay:-.4s"/>
      <rect class="dash" x="778.5" y="98" width="3" height="3" fill="#ffd27a" style="animation-delay:-.8s"/>
      <rect class="dash" x="778.5" y="98" width="3" height="3" fill="#ffd27a" style="animation-delay:-1.2s"/>
    </g>
    <!-- fade the scene into the card -->
    <rect x="560" y="0" width="120" height="200" fill="url(#fadeL)"/>
  </g>
  <defs>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- text -->
  <text class="mono" x="44" y="54" font-size="14" fill="#7d8590" letter-spacing="3">RIDE ALONG</text>
  <text class="sans" x="44" y="108" font-size="44" font-weight="800" fill="url(#warm)">@bikerandvibes</text>
  <text class="sans" x="46" y="142" font-size="18" fill="#9da7b3">Biker Vibes</text>
  <text class="mono" x="46" y="172" font-size="14" fill="#7d8590">+ photography: @hhtthephotographer</text>

  <rect x="1" y="1" width="998" height="198" rx="20" fill="none" stroke="#30363d" stroke-width="2"/>
</svg>
